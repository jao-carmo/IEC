<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FatecADS - Academic System</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="bg-orb orb-one"></div>
<div class="bg-orb orb-two"></div>

<div class="container app-shell">
    <nav class="top-nav glass-panel">
        <span class="brand-title">FatecADS</span>
        <span class="text-muted">Academic System</span>
    </nav>

    <section class="hero-card hero-card-xl fade-in-up">
        <p class="eyebrow">Academic platform</p>
        <h1 class="page-title">FatecADS Academic System</h1>
        <p class="subtitle">Secure access, structured data, and a consistent experience for managing academic records.</p>

        <div class="hero-pill-row">
            <span class="hero-pill">Secure access</span>
            <span class="hero-pill">Data-driven UI</span>
            <span class="hero-pill">Responsive design</span>
        </div>

        <div class="spacer-24"></div>

        <div class="actions">
            <form action="/login" method="get">
                <button type="submit" class="button-link button-link-glow">System Access</button>
            </form>

            <form action="/users/create" method="get">
                <button type="submit" class="button-link button-link-ghost">Register</button>
            </form>
        </div>
    </section>
</div>
</body>
</html>
