<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FatecADS | Reset Password</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app-home">
<div class="bg-orb orb-one"></div>
<div class="bg-orb orb-two"></div>

<div class="container app-shell">
    <nav class="top-nav glass-panel">
        <span class="brand-title">FatecADS</span>
        <span class="text-muted">Password recovery</span>
    </nav>

    <section class="hero-card hero-card-compact fade-in-up">
        <p class="eyebrow">Secure reset</p>
        <h1 class="page-title">Set a new password</h1>
        <p class="subtitle">Choose a strong password to protect your account.</p>

        <div class="spacer-24"></div>

        <p th:if="${errorMessage}" th:text="${errorMessage}" class="error-message"></p>

        <div class="spacer-24"></div>

        <form method="post" th:action="@{/reset-password}" class="form-card">
            <input type="hidden" name="token" th:value="${token}">

            <label for="password">New password</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a strong password"
                    autocomplete="new-password"
                    required
            >

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Update password</button>
        </form>

        <div class="spacer-24"></div>

        <div class="actions">
            <a class="button-link button-link-ghost" th:href="@{/login}">Back to login</a>
        </div>
    </section>
</div>
</body>
</html>
