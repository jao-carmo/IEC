<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>FatecADS | User Registration</title>
</head>
<body>
<div class="bg-orb orb-one"></div>
<div class="bg-orb orb-two"></div>

<main class="container app-shell fade-in-up">
    <section class="hero-card hero-card-compact glass-panel">
        <div class="page-header">
            <div>
                <p class="eyebrow">Smart form</p>
                <h1 class="page-title">User registration</h1>
            </div>
            <div class="actions">
                <a class="button-link button-link-ghost" th:href="@{/home}">Back to Home</a>
            </div>
        </div>
        <p class="subtitle">Create secure user profiles with consistent data so access and auditing remain reliable.</p>
    </section>

    <p th:if="${errorMessage}" th:text="${errorMessage}" class="error-message mt-16" role="alert"></p>

    <section class="form-layout mt-20">
        <aside class="side-note glass-panel">
            <p class="eyebrow">Best practices</p>
            <h2 class="side-note-title">Credential standards</h2>
            <p class="side-note-text">Confirm email and login accuracy. Use strong passwords and assign the correct role.</p>
            <div class="hero-pill-row mt-16">
                <span class="hero-pill">Verified email</span>
                <span class="hero-pill">Unique login</span>
                <span class="hero-pill">Role clarity</span>
            </div>
        </aside>

        <form class="form-card brutal-edge" th:action="@{/users/save}" method="post" th:object="${user}">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" th:field="*{userId}" />

            <label for="fullName">Full name</label>
            <input id="fullName" type="text" th:field="*{fullName}" maxlength="40" required autocomplete="name" placeholder="Example: Ana Clara Lima">

            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" maxlength="40" required autocomplete="email" placeholder="example@fatecads.edu">

            <label for="login">Login</label>
            <input id="login" type="text" th:field="*{login}" maxlength="40" required autocomplete="username" placeholder="Example: ana.lima">

            <label for="password">Password</label>
            <input id="password" type="password" th:field="*{password}" maxlength="40" required autocomplete="new-password" placeholder="Create a strong password">

            <label for="role">Role</label>
            <input id="role" type="text" th:field="*{role}" maxlength="30" required placeholder="Example: ROLE_USER">

            <button type="submit">Save user</button>
        </form>
    </section>
</main>
</body>
</html>
