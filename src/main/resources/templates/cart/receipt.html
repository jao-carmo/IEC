<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FatecADS | Order details</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="container app-shell fade-in-up"><section class="hero-card"><div class="page-header"><div><p class="eyebrow">Confirmed order</p><h1 class="page-title" th:text="${'Order #' + order.orderId}"></h1><p class="subtitle" th:text="${order.orderDate}"></p></div><a class="button-link button-link-ghost" th:href="@{${backToOrders != null ? backToOrders : '/purchases'}}">Back to orders</a></div></section>
<section class="table-wrap"><table class="data-table"><thead><tr><th scope="col">Product</th><th scope="col">Quantity</th><th scope="col">Unit price</th><th scope="col">Subtotal</th></tr></thead><tbody><tr th:each="item : ${order.item}"><td th:text="${item.product.productDescription}"></td><td th:text="${item.amount}"></td><td th:text="${'$ ' + #numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}"></td><td th:text="${'$ ' + #numbers.formatDecimal(item.subtotal, 1, 'COMMA', 2, 'POINT')}"></td></tr></tbody></table></section><section class="hero-card"><p class="eyebrow">Total</p><h2 class="side-note-title" th:text="${'$ ' + #numbers.formatDecimal(order.orderTotal, 1, 'COMMA', 2, 'POINT')}"></h2></section></main></body></html>
