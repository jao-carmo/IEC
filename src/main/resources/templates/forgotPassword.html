<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FatecADS | Forgot Password</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app-home">
<div class="bg-orb orb-one"></div>
<div class="bg-orb orb-two"></div>

<div class="container app-shell">
    <nav class="top-nav glass-panel">
        <span class="brand-title">FatecADS</span>
        <span class="text-muted">Password recovery</span>
    </nav>

    <section class="hero-card hero-card-compact fade-in-up">
        <p class="eyebrow">Account access</p>
        <h1 class="page-title">Forgot your password?</h1>
        <p class="subtitle">Enter your email and we will send a secure reset link.</p>

        <div class="spacer-24"></div>

        <p th:if="${successMessage}" th:text="${successMessage}" class="badge badge-success"></p>
        <p th:if="${errorMessage}" th:text="${errorMessage}" class="error-message"></p>

        <div class="spacer-24"></div>

        <form method="post" th:action="@{/forgot-password}" class="form-card">
            <label for="email">Email</label>
            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@fatecads.edu"
                    autocomplete="email"
                    required
            >
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Send reset link</button>
        </form>

        <div class="spacer-24"></div>

        <div class="actions">
            <a class="button-link button-link-ghost" th:href="@{/login}">Back to login</a>
        </div>
    </section>
</div>
</body>
</html>
