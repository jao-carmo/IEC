<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Student registration</title>
</head>
<body>
    <h1 style="text-align: center;">Student registration</h1>

    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red; text-align: center;"></p>

    <form th:action="@{/student/save}" method="post" th:object="${student}">

        <input type="hidden" th:field="*{studentId}" />

        <label>Name:</label>
        <input type="text" th:field="*{fullName}" maxlength="40" required>
        <br />
        <label>E-mail:</label>
        <input type="text" th:field="*{email}" maxlength="100">
        <br />
        <label>Phone:</label>
        <input type="text" th:field="*{phone}" maxlength="15" required>
        <br />
        <label>Address:</label>
        <input type="text" th:field="*{address}" maxlength="100" required>
        <br />
        <label>CPF:</label>
        <input type="text" th:field="*{cpf}" maxlength="14" required>
        <br />
        <label>RA:</label>
        <input type="text" th:field="*{registrationNumber}" required>
        <button type="submit">Save</button>
    </form>
</body>
</html>
