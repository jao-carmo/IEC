spring.application.name=fatecads
spring.config.import=optional:file:./application-local.properties
app.root.password=${ROOT_PASSWORD:}
app.root.email=${ROOT_EMAIL:root@fatecads.local}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.demo-data.enabled=${DEMO_DATA_ENABLED:true}

# Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fatecads_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# Automatically update the database schema
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console
spring.jpa.show-sql=false

# Do not format SQL queries
spring.jpa.properties.hibernate.format_sql=false

# Server port configuration
server.port=8080

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
spring.mail.from=${MAIL_FROM:noreply@fatecads.local}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
